context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-avro
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - make
    - libboost-devel
    - boost-cpp
    - zlib
  host:
    - avrocpp 1.12.*
  run:
    - avrocpp 1.12.*

tests:
  - script:
    - if: unix
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/avro/init.q
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/avro/clib.li64.so
    - if: linux and aarch64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/avro/clib.la64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/avro/clib.ma64.so
    - if: osx and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/avro/clib.mi64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\avro\\init.q exit 1
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\\avro\\clib.wi64.dll exit 1

about:
  homepage: https://github.com/KxSystems/avrokdb
  repository: https://github.com/KxSystems/avrokdb
  license: Apache-2.0
  license_file: LICENSE
  summary: kdb-x APIs to encode and decode Apache Avro serialized data.
  description: |
    This interface allows kdb-x users to encode and decode Apache Avro
    serialized data. Apache Avro is a data serialization system that provides
    rich data structures and a compact, fast, binary data format. Avro relies
    on schemas defined with JSON, so each datum can be written with no
    per-value overhead, making serialization both fast and small.

    Once installed, load the module in q with: avro:use`kx.avro
